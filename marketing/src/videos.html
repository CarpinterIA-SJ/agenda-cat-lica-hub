<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Reels Guardião Eventos</title>
<link rel="stylesheet" href="base.css">
<style>
  body { margin: 0; background: #000; }
  #palco { width: 1080px; height: 1920px; position: relative; overflow: hidden; font-family: 'Inter', sans-serif; }
  .cena { position: absolute; inset: 0; padding: 150px 84px; }
  .cena.claro { background: var(--creme); color: var(--tinta); }
  .cena.escuro { background: var(--verde); color: #fff; }
  .abs { position: absolute; }
  .big { font-size: 92px; font-weight: 900; letter-spacing: -.035em; line-height: 1.04; }
  .big em { font-family: 'Fraunces', serif; font-style: italic; font-weight: 600; color: var(--verde-2); }
  .escuro .big em { color: var(--verde-claro); }
  .med { font-size: 56px; font-weight: 800; letter-spacing: -.02em; line-height: 1.15; }
  .peq { font-size: 38px; font-weight: 600; line-height: 1.35; }
  .bolha { background: #fff; border-radius: 28px; padding: 26px 34px; font-size: 38px; font-weight: 600; box-shadow: 0 18px 50px rgba(0,0,0,.14); }
  .bolha small { display: block; font-size: 24px; color: #6b7d73; font-weight: 700; margin-bottom: 6px; }
  .arquivo { background: #fff; border-radius: 20px; padding: 22px 30px; font-size: 34px; font-weight: 700; box-shadow: 0 18px 50px rgba(0,0,0,.14); display: flex; gap: 18px; align-items: center; }
  .arquivo i { width: 54px; height: 64px; border-radius: 8px; background: #16a34a; display: inline-block; }
  .arquivo i.img { background: #3b82f6; }
  .arquivo i.cad { background: #b45309; }
  .celular { width: 640px; height: 1240px; border-radius: 72px; background: #0a0f0d; padding: 22px; box-shadow: 0 40px 120px rgba(0,0,0,.45); }
  .tela { width: 100%; height: 100%; border-radius: 52px; background: #f6f8f6; overflow: hidden; position: relative; color: var(--tinta); }
  .tela-topo { background: var(--verde); color: #fff; padding: 70px 40px 34px; font-size: 32px; font-weight: 800; }
  .tela-topo small { display: block; font-size: 22px; font-weight: 600; opacity: .7; margin-bottom: 6px; }
  .stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; padding: 26px 26px 10px; }
  .stat { background: #fff; border-radius: 22px; padding: 20px 14px; text-align: center; border: 2px solid #e3ebe6; }
  .stat b { display: block; font-size: 46px; font-weight: 900; color: var(--verde); }
  .stat span { font-size: 20px; font-weight: 700; color: #6b7d73; }
  .linha { margin: 14px 26px 0; background: #fff; border-radius: 20px; padding: 20px 24px; display: flex; justify-content: space-between; align-items: center; font-size: 27px; font-weight: 700; border: 2px solid #e3ebe6; }
  .badge { font-size: 21px; font-weight: 800; padding: 8px 16px; border-radius: 999px; background: #dcfce7; color: #166534; }
  .campo { margin: 18px 30px 0; background: #fff; border: 2px solid #dfe8df; border-radius: 18px; padding: 16px 22px; }
  .campo small { display: block; font-size: 20px; font-weight: 700; color: #6b7d73; margin-bottom: 4px; }
  .campo div { font-size: 30px; font-weight: 700; min-height: 38px; }
  .check { width: 34px; height: 34px; border-radius: 10px; background: var(--verde); color: #fff; display: inline-grid; place-items: center; font-size: 24px; font-weight: 900; margin-right: 16px; }
  .botao { margin: 30px; background: var(--ouro); color: #fff; font-size: 34px; font-weight: 800; text-align: center; padding: 28px; border-radius: 22px; }
  .item-ok { display: flex; align-items: center; gap: 22px; font-size: 42px; font-weight: 800; }
  .item-ok .dot { width: 58px; height: 58px; border-radius: 16px; background: var(--ouro); color: var(--verde); display: grid; place-items: center; font-size: 34px; font-weight: 900; }
  .selo-g { width: 150px; height: 150px; border-radius: 38px; background: #fff; display: grid; place-items: center; }
  .selo-g svg { width: 84px; height: 84px; stroke: var(--verde); }
  .cta { background: var(--ouro); color: #fff; font-size: 52px; font-weight: 900; padding: 36px 60px; border-radius: 28px; display: inline-block; box-shadow: 0 20px 60px rgba(245,158,11,.35); }
  .papel { background: #fffdf5; border-radius: 18px; padding: 40px; box-shadow: 0 30px 80px rgba(0,0,0,.18); }
  .papel p { font-size: 34px; font-weight: 600; padding: 14px 0; border-bottom: 2px dashed #e2d9c5; color: #3f4b44; }
  .qr { display: grid; grid-template-columns: repeat(21, 1fr); width: 360px; height: 360px; background: #fff; padding: 22px; border-radius: 24px; }
  .qr i { background: #10231b; }
  .qr i.b { background: transparent; }
  .visor { position: absolute; inset: 0; background: #1d2622; }
  .mira { position: absolute; left: 100px; top: 330px; width: 396px; height: 396px; border: 6px solid rgba(255,255,255,.85); border-radius: 30px; }
  .scan { position: absolute; left: 100px; width: 396px; height: 6px; background: var(--ouro); box-shadow: 0 0 30px var(--ouro); }
  .ok-card { position: absolute; left: 26px; right: 26px; bottom: 40px; background: #fff; border-radius: 28px; padding: 30px; font-size: 30px; font-weight: 700; }
  .ok-card b { display: block; font-size: 38px; color: #166534; margin-bottom: 6px; }
</style>
</head>
<body>
<div id="palco"></div>
<script src="videos.js"></script>
</body>
</html>
